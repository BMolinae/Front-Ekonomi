<ion-content class="ion-padding">
  <form [formGroup]="form">
    <!-- CATEGORÍA -->
    <ion-item>
      <ion-label position="floating">Categoría</ion-label>
      <ion-input formControlName="categoria" placeholder=""></ion-input>
    </ion-item>

    <!-- DESCRIPCIÓN -->
    <ion-item>
      <ion-label position="floating">Descripción</ion-label>
      <ion-input formControlName="descripcion" placeholder=""></ion-input>
    </ion-item>

    <!-- FECHA -->
    <ion-item>
      <ion-label position="stacked">Fecha</ion-label>
      <ion-datetime
        presentation="date"
        formControlName="fecha"
        display-format="DD/MM/YYYY">
      </ion-datetime>
    </ion-item>

    <!-- MONTO -->
    <ion-item>
      <ion-label position="floating">Monto</ion-label>
      <ion-input type="number" formControlName="monto"></ion-input>
    </ion-item>

    <!-- TIPO -->
    <ion-item>
      <ion-label>Tipo</ion-label>
      <ion-segment formControlName="tipo">
        <ion-segment-button value="gasto">
          <ion-label>Gasto</ion-label>
        </ion-segment-button>
        <ion-segment-button value="ingreso">
          <ion-label>Ingreso</ion-label>
        </ion-segment-button>
      </ion-segment>
    </ion-item>

    <!-- BOTÓN GUARDAR -->
    <div class="ion-padding-top">
      <ion-button expand="block" color="primary" (click)="guardarMovimiento()">
        Guardar
      </ion-button>
    </div>
  </form>
</ion-content>
