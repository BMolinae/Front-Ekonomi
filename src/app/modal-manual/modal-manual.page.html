<!-- modal-manual.page.html -->
<ion-header>
  <ion-toolbar class="modal-header">
    <ion-title>Nuevo Movimiento</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cancelar()" class="close-button">
        <ion-icon name="close" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="modal-content">
  <!-- Fondo igual al dashboard pero más simple -->
  <div class="mobile-background"></div>

  <div class="form-container">
    <!-- Card del formulario -->
    <ion-card class="mobile-form-card">
      <!-- Descripción -->
      <ion-item class="mobile-form-item">
        <ion-label position="stacked">Descripción</ion-label>
        <ion-input [(ngModel)]="movimiento.descripcion" 
                  class="mobile-input"
                  placeholder="Ej: Compra en el supermercado"></ion-input>
      </ion-item>

      <!-- Monto -->
      <ion-item class="mobile-form-item">
        <ion-label position="stacked">Monto</ion-label>
        <ion-input type="number" 
                  [(ngModel)]="movimiento.monto"
                  class="mobile-input"
                  placeholder="0"></ion-input>
      </ion-item>

      <!-- Tipo (Gasto/Ingreso) - Versión móvil optimizada -->
      <div class="mobile-segment-container">
        <div class="segment-label">Tipo</div>
        <div class="mobile-segment">
          <button class="segment-button" 
                  [class.active]="movimiento.tipo === 'gasto'"
                  (click)="movimiento.tipo = 'gasto'">
            Gasto
          </button>
          <button class="segment-button"
                  [class.active]="movimiento.tipo === 'ingreso'"
                  (click)="movimiento.tipo = 'ingreso'">
            Ingreso
          </button>
        </div>
      </div>

      <!-- Categoría -->
      <ion-item class="mobile-form-item">
        <ion-label position="stacked">Categoría</ion-label>
        <ion-select [(ngModel)]="movimiento.categoria" 
                   interface="action-sheet"
                   class="mobile-select">
          <ion-select-option *ngFor="let cat of categorias" [value]="cat.value">
            {{ cat.label }}
          </ion-select-option>
        </ion-select>
      </ion-item>

      <!-- Botón Guardar -->
      <ion-button expand="block" 
                 (click)="guardarMovimiento()"
                 [disabled]="!movimiento.descripcion || !movimiento.monto"
                 class="mobile-save-button">
        Guardar Movimiento
      </ion-button>
    </ion-card>
  </div>
</ion-content>
